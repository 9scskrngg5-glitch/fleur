<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pour toi</title>
<style>
  :root {
    --pink: #f7c6d9;
    --pink-dark: #e08bb0;
    --cream: #fff7f5;
    --green: #7fae82;
    --text: #4a3b3f;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Georgia', 'Times New Roman', serif;
    background: linear-gradient(180deg, #fdf0f0 0%, #fce4ec 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .screen {
    display: none;
    width: 100%;
    min-height: 100vh;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    padding: 24px;
    text-align: center;
  }

  .screen.active {
    display: flex;
  }

  /* ---------- ECRAN 1 : BOUQUET ---------- */
  #entree {
    position: relative;
  }

  .bouquet {
    width: 220px;
    height: 220px;
    margin-bottom: 30px;
    animation: float 4s ease-in-out infinite;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(-12px); }
  }

  .titre-entree {
    font-size: 1.4rem;
    color: var(--text);
    margin-bottom: 30px;
    font-style: italic;
  }

  button {
    background: var(--pink-dark);
    color: white;
    border: none;
    padding: 14px 36px;
    border-radius: 30px;
    font-size: 1rem;
    cursor: pointer;
    font-family: inherit;
    transition: transform 0.2s, background 0.2s;
    box-shadow: 0 4px 12px rgba(224, 139, 176, 0.4);
  }

  button:hover {
    background: var(--pink);
    transform: scale(1.05);
  }

  /* ---------- ECRAN 2 : LOGIN ---------- */
  #login-box {
    background: white;
    padding: 40px 30px;
    border-radius: 20px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.1);
    max-width: 340px;
    width: 100%;
  }

  #login-box h2 {
    color: var(--text);
    margin-bottom: 20px;
    font-size: 1.2rem;
  }

  #password-input {
    width: 100%;
    padding: 12px 16px;
    border: 2px solid var(--pink);
    border-radius: 30px;
    font-size: 1rem;
    text-align: center;
    margin-bottom: 16px;
    font-family: inherit;
    outline: none;
  }

  #password-input:focus {
    border-color: var(--pink-dark);
  }

  #error-msg {
    color: #c0392b;
    font-size: 0.85rem;
    margin-top: 10px;
    min-height: 18px;
  }

  /* ---------- ECRAN 3 : LETTRE ---------- */
  #lettre-contenu {
    background: white;
    padding: 50px 40px;
    border-radius: 20px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.1);
    max-width: 600px;
    width: 100%;
    text-align: left;
    animation: appear 1.2s ease-in;
  }

  @keyframes appear {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  #lettre-contenu p {
    color: var(--text);
    line-height: 1.8;
    font-size: 1.05rem;
    white-space: pre-line;
  }

  .signature {
    margin-top: 30px;
    text-align: right;
    font-style: italic;
    color: var(--pink-dark);
  }

  .petales {
    position: fixed;
    top: -20px;
    font-size: 1.5rem;
    animation: tomber linear infinite;
    pointer-events: none;
    z-index: 0;
  }

  @keyframes tomber {
    to {
      transform: translateY(110vh) rotate(360deg);
    }
  }

  #music-indicator {
    margin-top: 20px;
    font-size: 0.85rem;
    color: var(--pink-dark);
    opacity: 0.7;
  }
</style>
</head>
<body>

<!-- ECRAN 1 : ENTREE AVEC BOUQUET -->
<div id="entree" class="screen active">
  <svg class="bouquet" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <!-- Tiges -->
    <line x1="100" y1="200" x2="100" y2="120" stroke="#7fae82" stroke-width="4"/>
    <line x1="100" y1="180" x2="75" y2="130" stroke="#7fae82" stroke-width="3"/>
    <line x1="100" y1="180" x2="125" y2="130" stroke="#7fae82" stroke-width="3"/>
    <!-- Feuilles -->
    <ellipse cx="80" cy="160" rx="10" ry="4" fill="#7fae82" transform="rotate(-30 80 160)"/>
    <ellipse cx="120" cy="160" rx="10" ry="4" fill="#7fae82" transform="rotate(30 120 160)"/>
    <!-- Fleur centrale -->
    <g transform="translate(100,90)">
      <circle cx="0" cy="-18" r="14" fill="#f7c6d9"/>
      <circle cx="17" cy="-8" r="14" fill="#f7c6d9"/>
      <circle cx="17" cy="10" r="14" fill="#f7c6d9"/>
      <circle cx="0" cy="20" r="14" fill="#f7c6d9"/>
      <circle cx="-17" cy="10" r="14" fill="#f7c6d9"/>
      <circle cx="-17" cy="-8" r="14" fill="#f7c6d9"/>
      <circle cx="0" cy="0" r="10" fill="#e08bb0"/>
    </g>
    <!-- Fleur gauche -->
    <g transform="translate(70,120) scale(0.7)">
      <circle cx="0" cy="-18" r="14" fill="#ffd9e6"/>
      <circle cx="17" cy="-8" r="14" fill="#ffd9e6"/>
      <circle cx="17" cy="10" r="14" fill="#ffd9e6"/>
      <circle cx="0" cy="20" r="14" fill="#ffd9e6"/>
      <circle cx="-17" cy="10" r="14" fill="#ffd9e6"/>
      <circle cx="-17" cy="-8" r="14" fill="#ffd9e6"/>
      <circle cx="0" cy="0" r="10" fill="#e08bb0"/>
    </g>
    <!-- Fleur droite -->
    <g transform="translate(130,120) scale(0.7)">
      <circle cx="0" cy="-18" r="14" fill="#ffd9e6"/>
      <circle cx="17" cy="-8" r="14" fill="#ffd9e6"/>
      <circle cx="17" cy="10" r="14" fill="#ffd9e6"/>
      <circle cx="0" cy="20" r="14" fill="#ffd9e6"/>
      <circle cx="-17" cy="10" r="14" fill="#ffd9e6"/>
      <circle cx="-17" cy="-8" r="14" fill="#ffd9e6"/>
      <circle cx="0" cy="0" r="10" fill="#e08bb0"/>
    </g>
  </svg>
  <p class="titre-entree">Une petite surprise t'attend...</p>
  <button onclick="goToLogin()">Ouvrir</button>
</div>

<!-- ECRAN 2 : LOGIN -->
<div id="login" class="screen">
  <div id="login-box">
    <h2>Entre le mot de passe</h2>
    <input type="password" id="password-input" placeholder="••••••" inputmode="numeric">
    <br>
    <button onclick="checkPassword()">Valider</button>
    <div id="error-msg"></div>
  </div>
</div>

<!-- ECRAN 3 : LETTRE + MUSIQUE -->
<div id="lettre" class="screen">
  <div id="lettre-contenu">
    <p id="texte-lettre">.</p>
    <div class="signature">Gilles</div>
  </div>
  <div id="music-indicator">🎵 lecture en cours...</div>
  <audio id="audio-player" loop>
    <!-- Remplace "musique.mp3" par le nom exact de ton fichier audio, placé dans le même dossier que ce fichier HTML -->
    <source src="Mac DeMarco My Kind Of Woman.mp3" type="audio/mpeg">
  </audio>
</div>

<script>
  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  function goToLogin() {
    showScreen('login');
  }

  function checkPassword() {
    const input = document.getElementById('password-input').value;
    const errorMsg = document.getElementById('error-msg');
    if (input === '240925') {
      showScreen('lettre');
      lancerPetales();

      // Démarrer la musique - appel synchrone pour rester dans le contexte du clic utilisateur
      const audio = document.getElementById('audio-player');
      const musicIndicator = document.getElementById('music-indicator');

      audio.play()
        .then(() => {
          musicIndicator.textContent = '🎵 musique en cours...';
        })
        .catch((err) => {
          console.log('Autoplay bloqué:', err);
          musicIndicator.textContent = '🎵 clique n\'importe où pour lancer la musique';
          document.addEventListener('click', () => {
            audio.play();
            musicIndicator.textContent = '🎵 musique en cours...';
          }, { once: true });
        });

    } else {
      errorMsg.textContent = 'Mot de passe incorrect, réessaie 💗';
      document.getElementById('password-input').value = '';
    }
  }

  document.getElementById('password-input').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') checkPassword();
  });

  function lancerPetales() {
    const emojis = ['🌸', '🌷', '💮'];
    setInterval(() => {
      const p = document.createElement('div');
      p.className = 'petales';
      p.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      p.style.left = Math.random() * 100 + 'vw';
      p.style.animationDuration = (4 + Math.random() * 4) + 's';
      document.body.appendChild(p);
      setTimeout(() => p.remove(), 8000);
    }, 600);
  }
</script>

</body>
</html>
